# Render Blueprint for AnatoScan AR (AnaQR)
# Deploys both Backend API and Frontend Web App as Render Web Services
# https://render.com/docs/blueprint-spec

services:
  # ─── 1. Backend Web Service (NestJS API) ───────────────────────────
  - type: web
    name: anatoscan-backend
    runtime: docker
    dockerfilePath: docker/Dockerfile.api
    dockerContext: .
    plan: starter
    region: oregon
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: anatoscan-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: anatoscan-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"

  # ─── 2. Frontend Web Service (Next.js 15) ──────────────────────────
  - type: web
    name: anatoscan-frontend
    runtime: docker
    dockerfilePath: docker/Dockerfile.web
    dockerContext: .
    plan: starter
    region: oregon
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: anatoscan-backend
          property: host
          envVarKey: NEXT_PUBLIC_API_URL
      - key: NEXT_PUBLIC_APP_URL
        value: "https://anatoscan-frontend.onrender.com"

  # ─── 3. Managed Redis (BullMQ, Caching & Telemetry) ────────────────
  - type: redis
    name: anatoscan-redis
    plan: starter
    region: oregon
    maxmemoryPolicy: noeviction
    ipAllowList: []

databases:
  # ─── 4. Managed PostgreSQL 16 ──────────────────────────────────────
  - name: anatoscan-postgres
    databaseName: anatoscan_db
    user: anatoscan
    plan: starter
    region: oregon
    postgresMajorVersion: 16
