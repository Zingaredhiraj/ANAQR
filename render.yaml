# Render Blueprint for AnatoScan AR (AnaQR) Backend
# https://render.com/docs/blueprint-spec

services:
  # NestJS API Service
  - type: web
    name: anatoscan-api
    runtime: docker
    dockerfilePath: docker/Dockerfile.api
    dockerContext: .
    plan: starter
    region: oregon
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: anatoscan-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: anatoscan-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://*.vercel.app,http://localhost:3000

  # Managed Redis for Telemetry, BullMQ & Rate Limiting
  - type: redis
    name: anatoscan-redis
    plan: starter
    region: oregon
    maxmemoryPolicy: noeviction
    ipAllowList: []

databases:
  # Managed PostgreSQL 16
  - name: anatoscan-postgres
    databaseName: anatoscan_db
    user: anatoscan
    plan: starter
    region: oregon
    postgresMajorVersion: 16
