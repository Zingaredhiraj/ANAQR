services:
  postgres:
    image: postgres:16-alpine
    container_name: anatoscan_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: anatoscan
      POSTGRES_PASSWORD: anatoscan_dev
      POSTGRES_DB: anatoscan_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anatoscan -d anatoscan_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: anatoscan_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
