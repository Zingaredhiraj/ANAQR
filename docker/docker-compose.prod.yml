version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: anatoscan-postgres-prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-anatoscan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-anatoscan_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-anatoscan_db}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    networks:
      - anatoscan-prod-net

  redis:
    image: redis:7-alpine
    container_name: anatoscan-redis-prod
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-anatoscan_redis_pass}
    volumes:
      - redis_prod_data:/data
    networks:
      - anatoscan-prod-net

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: anatoscan-api-prod
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-anatoscan}:${POSTGRES_PASSWORD:-anatoscan_secure_pass}@postgres:5432/${POSTGRES_DB:-anatoscan_db}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:-anatoscan_redis_pass}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS}
      API_PORT: 4000
    depends_on:
      - postgres
      - redis
    ports:
      - "4000:4000"
    networks:
      - anatoscan-prod-net

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    container_name: anatoscan-web-prod
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
    depends_on:
      - api
    ports:
      - "3000:3000"
    networks:
      - anatoscan-prod-net

volumes:
  postgres_prod_data:
  redis_prod_data:

networks:
  anatoscan-prod-net:
    driver: bridge
